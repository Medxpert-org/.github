name: Validate CODEOWNERS

on:
  pull_request:

permissions:
  contents: read

jobs:
  # NOTE: job name is load-bearing — it is the required status check context
  #       ("validate-codeowners") on the default branch. Do NOT rename.
  validate:
    name: validate-codeowners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locate CODEOWNERS
        id: locate
        run: |
          F=""
          for c in CODEOWNERS .github/CODEOWNERS docs/CODEOWNERS; do
            if [ -f "$c" ]; then F="$c"; break; fi
          done
          if [ -z "$F" ]; then
            echo "::error::CODEOWNERS not found"
            exit 1
          fi
          echo "file=$F" >> "$GITHUB_OUTPUT"
      - name: Require team-based owner
        run: |
          F="${{ steps.locate.outputs.file }}"
          if ! grep -Eq '@[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' "$F"; then
            echo "::error::CODEOWNERS has no team owner (@org/team)"
            exit 1
          fi
          echo "team-based CODEOWNERS OK ($F)"
      - name: Detect duplicate CODEOWNERS patterns
        run: |
          F="${{ steps.locate.outputs.file }}"
          dup=$(grep -vE '^\s*#|^\s*$' "$F" | awk '{print $1}' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::duplicate CODEOWNERS patterns detected: $dup"
            exit 1
          fi
          echo "no duplicate CODEOWNERS patterns"
      - name: Validate versioned ruleset JSON (jq)
        run: |
          shopt -s nullglob
          files=(.github/rulesets/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no versioned ruleset files present"
            exit 0
          fi
          fail=0
          for f in "${files[@]}"; do
            if jq empty "$f" 2>/dev/null; then
              echo "OK   $f"
            else
              echo "::error file=$f::$f is not valid JSON"
              fail=1
            fi
          done
          exit $fail
